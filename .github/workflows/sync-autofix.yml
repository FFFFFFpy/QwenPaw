name: Upstream Sync Autofix

on:
  push:
    branches:
      - sync/upstream-20260715

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.head_commit.message != 'style: apply pre-commit autofixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/upstream-20260715
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install formatting tools
        run: |
          pip install setuptools==68.2.2 wheel==0.41.2
          pip install -q -e ".[dev]"

      - name: Apply pre-commit autofixes
        run: pre-commit run --all-files || true

      - name: Commit autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No autofixes to commit"
          else
            git commit -m "style: apply pre-commit autofixes"
            git push origin HEAD:sync/upstream-20260715
          fi
