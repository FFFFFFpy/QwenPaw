name: Upstream Sync Unit Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sync-unit-diagnostic.yml'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  ubuntu-py311-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Build console frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          cd console
          npm ci
          npm run build

      - name: Copy console build into package
        run: |
          rm -rf src/qwenpaw/console/*
          mkdir -p src/qwenpaw/console
          cp -R console/dist/* src/qwenpaw/console/

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,test,full]'

      - name: Run unit tests and capture diagnostics
        id: pytest
        shell: bash
        run: |
          set +e
          pytest tests/unit -q --tb=short > unit-diagnostic.log 2>&1
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 250 unit-diagnostic.log

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-py311-unit-diagnostic
          path: unit-diagnostic.log
          if-no-files-found: error

      - name: Report pytest result
        if: always()
        run: exit '${{ steps.pytest.outputs.exit_code }}'
