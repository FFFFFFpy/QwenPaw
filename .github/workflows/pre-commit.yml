name: Pre-commit Checks

on: [pull_request]

jobs:
  spam-gate:
    name: PR Spam Gate
    uses: ./.github/workflows/pr-spam-gate.yml
    with:
      author: ${{ github.event.pull_request.user.login }}

  run:
    needs: [spam-gate]
    if: needs.spam-gate.outputs.blocked != 'true'
    runs-on: ubuntu-latest
    env:
      PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QwenPaw and pre-commit
        run: |
          pip install setuptools==68.2.2 wheel==0.41.2
          pip install -q -e ".[dev]"
          pre-commit install

      - name: Run pre-commit
        run: |
          pre-commit run --all-files > pre-commit.log 2>&1 || true
          tail -n 200 pre-commit.log

      - name: Upload pre-commit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-pre-commit-log
          path: pre-commit.log
          if-no-files-found: error

      - name: Report result
        run: |
          if grep -q Failed pre-commit.log; then
            exit 1
          fi
