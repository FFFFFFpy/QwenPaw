name: Pre-commit Checks

on: [pull_request]

permissions:
  contents: write

jobs:
  spam-gate:
    name: PR Spam Gate
    uses: ./.github/workflows/pr-spam-gate.yml
    with:
      author: ${{ github.event.pull_request.user.login }}

  run:
    needs: [spam-gate]
    if: needs.spam-gate.outputs.blocked != 'true'
    runs-on: ubuntu-latest
    env:
      PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install QwenPaw and pre-commit
        run: |
          pip install setuptools==68.2.2 wheel==0.41.2
          pip install -q -e ".[dev]"
          pre-commit install

      - name: Apply upstream integration edits
        run: python .github/scripts/apply_upstream_sync_fixes.py

      - name: Run pre-commit
        run: pre-commit run --all-files 2>&1 | tee pre-commit.log || true

      - name: Commit generated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit --no-verify -m "fix: reconcile upstream with subscription customizations"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Report result
        run: |
          if grep -q Failed pre-commit.log; then
            exit 1
          fi
