name: Pre-commit Checks

on: [push, pull_request]

permissions:
  contents: write

jobs:
  spam-gate:
    name: PR Spam Gate
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-spam-gate.yml
    with:
      author: ${{ github.event.pull_request.user.login }}

  run:
    needs: [spam-gate]
    if: |
      always() &&
      (needs.spam-gate.result == 'skipped' || needs.spam-gate.outputs.blocked != 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    env:
      OS: ubuntu-latest
      PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update setuptools and wheel
        run: |
          pip install setuptools==68.2.2 wheel==0.41.2

      - name: Install QwenPaw with dev dependencies
        run: |
          pip install -q -e ".[dev]"

      - name: Install pre-commit hooks
        run: |
          pre-commit install

      - name: Run pre-commit and commit mechanical fixes
        run: |
          pre-commit run --all-files > pre-commit.log 2>&1 || true
          tail -n 80 pre-commit.log

          if [[ "${GITHUB_REF_NAME}" == "sync/upstream-20260715" || "${GITHUB_HEAD_REF}" == "sync/upstream-20260715" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "style: apply pre-commit autofixes"
              git push origin HEAD:sync/upstream-20260715
            fi
          fi

          if grep -q Failed pre-commit.log; then
            echo -e "\e[41m  [**FAIL**] pre-commit checks failed; mechanical fixes were committed when available. \e[0m"
            exit 1
          fi
          echo -e "\e[46m  ********************************Passed******************************** \e[0m"

      - name: Upload pre-commit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-commit-log
          path: pre-commit.log
          if-no-files-found: error
